    const pages=Math.max(1,Math.ceil(filtered.length/perPage));listPage=clamp(listPage,1,pages);
    const rows=filtered.slice((listPage-1)*perPage,listPage*perPage);
    el.innerHTML=`<div class="list-summary"><span>找到 ${filtered.length} 個學習詞條</span><span>第 ${listPage} / ${pages} 頁</span></div>${rows.length?`<div class="word-list">${rows.map((w)=>`<article class="word-item"><div class="word-item-main" data-open-word="${w.id}" role="button" tabindex="0" aria-label="查看 ${h(w.de)}"><h3 lang="de">${h(w.de)}</h3><p>${h(w.zh)} · ${h(w.pos)}</p><div class="word-item-meta"><span class="word-status ${rec(w.id)?.rating||''}"></span>Day ${w.day} · ${h(w.topic.replace(/^\d+\s*/,''))}</div></div><button type="button" class="icon-only" data-speak="word" data-word-id="${w.id}" aria-label="播放 ${h(w.de)} 的發音">${ico('volume')}</button><button type="button" class="icon-only" data-open-word="${w.id}" aria-label="開啟 ${h(w.de)} 的詳細內容">${ico('chevron')}</button></article>`).join('')}</div>`:'<div class="study-empty"><h2>沒有找到符合的單字</h2><p>試試其他關鍵字，或清除篩選條件。</p><button class="btn btn-outline" data-action="clear-filters">清除篩選</button></div>'}<div class="pagination"><button type="button" data-page-step="-1" ${listPage===1?'disabled':''}>上一頁</button><span>${listPage} / ${pages}</span><button type="button" data-page-step="1" ${listPage===pages?'disabled':''}>下一頁</button></div>`;
  }
  function statsView() {
    const s=stats();
    const dayTiles=Array.from({length:60},(_,i)=>{const day=i+1;const list=todayWords(day);const finished=list.every(isSeen);return `<div class="day-tile ${finished?'done':''} ${day===state.currentDay?'current':''}" title="Day ${day} · ${list.filter(isSeen).length}/${list.length} 已學">${day}</div>`;}).join('');
    const topics=[...new Set(WORDS.map((w)=>w.topic))];
    const bars=topics.map((t)=>{const subset=WORDS.filter((w)=>w.topic===t);const seen=subset.filter(isSeen).length;return `<div><div class="topic-line"><strong>${h(t.replace(/^\d+\s*/,''))}</strong><span>${seen} / ${subset.length}</span></div><div class="progress-track"><span style="width:${Math.round(seen/subset.length*100)}%"></span></div></div>`;}).join('');
    return `<section class="overview-hero"><div><h2>每一天，都是前進的一點點。</h2><p>你的學習紀錄僅保存在這台裝置的此瀏覽器中。可匯出備份避免遺失。</p></div><button type="button" class="btn btn-primary" data-route="learn">繼續學習 ${ico('arrow')}</button></section><div class="stats-grid"><article class="summary-stat"><span>650 個單字已學習</span><strong>${s.learned} <small style="font-size:13px;color:#9cab9e">/ ${TOTAL}</small></strong><div class="progress-track"><span style="width:${s.pct}%"></span></div><small>${s.pct}% 的詞條至少練習過一次</small></article><article class="summary-stat"><span>最新狀態為「已記住」</span><strong>${s.mastered} <small style="font-size:13px;color:#9cab9e">個單字</small></strong><div class="progress-track"><span style="width:${Math.round(s.mastered/TOTAL*100)}%"></span></div><small>隨複習結果更新，不等於永久記住</small></article></div><article class="panel"><h3 class="panel-title">60 天學習地圖</h3><p class="panel-subtitle">深綠色代表該天所有單字都至少評分過一次；外框標示目前學習天數。</p><div class="day-grid">${dayTiles}</div></article><div class="section-head"><div><h2>依主題的學習進度</h2><p>看看哪些生活情境已經最熟悉。</p></div></div><article class="panel"><div class="topic-bars">${bars}</div></article><div class="section-head"><div><h2>資料與語音設定</h2><p>沒有登入，也不會把你的學習紀錄傳送到伺服器。</p></div></div><article class="panel"><h3 class="panel-title">備份學習紀錄</h3><p class="panel-subtitle">更換電腦或清除瀏覽資料前，記得匯出 JSON 備份。</p><div class="settings-box"><button type="button" class="btn btn-subtle" data-action="export">${ico('download')} 匯出進度</button><button type="button" class="btn btn-outline" data-action="import">${ico('upload')} 匯入進度</button><button type="button" class="btn btn-danger" data-action="reset">清除全部紀錄</button></div></article>`;
  }
  function openWord(id) {
    const w=BY_ID.get(Number(id));if(!w)return;
    const el=document.getElementById('dialogContent');
    el.innerHTML=`<div class="dialog-top"><small>WORD #${String(w.id).padStart(3,'0')} · DAY ${w.day}</small><button class="close-btn" data-action="close-dialog" type="button" aria-label="關閉">${ico('close')}</button></div><h2 lang="de">${h(w.de)}</h2><div style="font-size:12px;color:#8aa08f">${h(w.pos)}</div><div class="dialog-zh">${h(w.zh)}</div>${soundButton(w.id,'word','播放單字')}<div class="dialog-section"><div class="dialog-label">BEISPIELSATZ · 例句</div><div class="dialog-example" lang="de">${h(w.example)}</div><div class="dialog-example-zh">${h(w.exampleZh)}</div>${soundButton(w.id,'sentence','播放例句')}</div><div class="dialog-footer">${h(w.topic.replace(/^\d+\s*/,''))} · ${rec(w.id)?(rec(w.id).rating==='easy'?'已記住':rec(w.id).rating==='hard'?'仍需練習':'再練習'):'尚未學習'}</div>`;
    const dialog=document.getElementById('wordDialog');dialog.showModal();
  }
  function render() {
    updateSide();
    const main=document.getElementById('main');
    if(page==='home')main.innerHTML=homeView();
    if(page==='learn')main.innerHTML=studyView('learn');
    if(page==='review')main.innerHTML=studyView('review');
    if(page==='library'){main.innerHTML=libraryView();renderLibraryResults();}
    if(page==='stats')main.innerHTML=statsView();
    if(page==='learn'||page==='review')refreshVoices();
    const warning=document.getElementById('storageAlert');warning.classList.toggle('hidden',canStore);
  }
  function advanceDay() {
    if(state.currentDay>=60){toast('已完成全部 60 天！');return;}
    if(!todayWords().every(isSeen)){toast('請先完成當天所有新單字，再前往下一天。');return;}
    state.currentDay++;saveState();startLearn(state.currentDay,false);toast(`開始 Day ${state.currentDay}！`);
  }
  function flipCard() {
    if(!session||session.index>=session.ids.length)return;
    flipped=!flipped;render();
    const card=document.querySelector('[data-flip-card]');if(card)card.focus({preventScroll:true});
  }
  function handleRating(rating) {
    if(!flipped||!session||session.index>=session.ids.length)return;
    applyRating(session.ids[session.index],rating);
    session.index++;flipped=false;render();
    const card=document.querySelector('[data-flip-card]');if(card)card.focus({preventScroll:true});
  }
  function exportProgress() {
    const blob=new Blob([JSON.stringify({app:'WortHaus A1',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`WortHaus-A1-學習進度-${todayKey()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已建立學習進度備份檔');
  }
  async function importProgress(file) {
    if(!file)return;
    if(file.size>2*1024*1024){toast('檔案太大，請使用 WortHaus 匯出的 JSON。');return;}
    try{
      const v=JSON.parse(await file.text());
      if(v.app!=='WortHaus A1'||!v.state||v.state.version!==1||typeof v.state.progress!=='object'||!v.state.progress)throw Error('invalid');
      if(!confirm('匯入備份會覆蓋目前這台裝置的學習進度，確定繼續嗎？'))return;
      const safe={version:1,currentDay:clamp(Number(v.state.currentDay)||1,1,60),progress:{},events:{},settings:{...DEFAULT_STATE.settings}};
      for(const [id,r] of Object.entries(v.state.progress)){
        if(!BY_ID.has(Number(id))||!r||!['again','hard','easy'].includes(r.rating))continue;
        const due=Number(r.dueAt),last=Number(r.lastReviewedAt);
        if(!Number.isFinite(due)||!Number.isFinite(last))continue;
        safe.progress[id]={rating:r.rating,dueAt:due,lastReviewedAt:last,reviews:clamp(Number(r.reviews)||1,1,99999),intervalDays:clamp(Number(r.intervalDays)||0,0,90)};
      }
      for(const [key,value] of Object.entries(v.state.events||{}))if(/^\d{4}-\d{2}-\d{2}$/.test(key))safe.events[key]=clamp(Number(value)||0,0,100000);
      safe.settings.speed=[0.75,0.85,1].includes(Number(v.state.settings?.speed))?Number(v.state.settings.speed):0.85;
      safe.settings.voiceURI=typeof v.state.settings?.voiceURI==='string'?v.state.settings.voiceURI.slice(0,200):'';
      state=safe;saveState();navigate('home');toast('已成功匯入學習進度！');
    }catch(error){toast('無法讀取備份，請選擇 WortHaus 匯出的 JSON 檔。');}
  }
  document.addEventListener('click',(event)=>{
    const speaker=event.target.closest('[data-speak]');
    if(speaker){event.stopPropagation();const w=BY_ID.get(Number(speaker.dataset.wordId));if(w)playSpeech(w,speaker.dataset.speak==='sentence'?'sentence':'word',speaker);return;}
    const route=event.target.closest('[data-route]');
    if(route){navigate(route.dataset.route);return;}
    const rating=event.target.closest('[data-rating]');
    if(rating){handleRating(rating.dataset.rating);return;}
    const speed=event.target.closest('[data-audio-speed]');
    if(speed){state.settings.speed=Number(speed.dataset.audioSpeed);saveState();render();toast('語音速度已更新');return;}
    const pageBtn=event.target.closest('[data-page-step]');
    if(pageBtn){listPage+=Number(pageBtn.dataset.pageStep);renderLibraryResults();return;}
    const open=event.target.closest('[data-open-word]');
    if(open){openWord(open.dataset.openWord);return;}
    const action=event.target.closest('[data-action]');
    if(action){
      switch(action.dataset.action){
        case 'start-learn':startLearn(state.currentDay,todayWords().every(isSeen));break;
        case 'start-review':startReview();break;
        case 'flip':flipCard();break;
        case 'advance-day':advanceDay();break;
        case 'repeat-day':startLearn(session?.day||state.currentDay,true);break;
        case 'clear-filters':listFilters.q='';listFilters.topic='all';listFilters.status='all';listPage=1;render();break;
        case 'close-dialog':document.getElementById('wordDialog').close();break;
        case 'export':exportProgress();break;
        case 'import':document.getElementById('importProgress').click();break;
        case 'reset':if(confirm('確定要清除全部學習紀錄？建議先匯出備份。此操作無法復原。')){state=JSON.parse(JSON.stringify(DEFAULT_STATE));saveState();navigate('home');toast('學習紀錄已清除');}break;
      }
      return;
    }
    if(event.target.closest('[data-flip-card]'))flipCard();
  });
  document.addEventListener('keydown',(event)=>{
    const target=event.target;
    if(target.matches('input,select,textarea')||document.getElementById('wordDialog').open)return;
    if((event.key==='Enter'||event.key===' ')&&target.matches('[data-open-word]')){event.preventDefault();openWord(target.dataset.openWord);return;}
    if(!['learn','review'].includes(page)||!session||session.index>=session.ids.length)return;
    if(event.key===' '){event.preventDefault();flipCard();return;}
    if(flipped&&['1','2','3'].includes(event.key)){event.preventDefault();handleRating({1:'again',2:'hard',3:'easy'}[event.key]);}
  });
  document.addEventListener('input',(event)=>{
    if(event.target.id==='searchWords'){listFilters.q=event.target.value;listPage=1;renderLibraryResults();}
  });
  document.addEventListener('change',(event)=>{
    const el=event.target;
    if(el.id==='topicFilter'){listFilters.topic=el.value;listPage=1;renderLibraryResults();}
    if(el.id==='statusFilter'){listFilters.status=el.value;listPage=1;renderLibraryResults();}
    if(el.id==='voicePicker'){state.settings.voiceURI=el.value;saveState();toast('德文語音已更新');}
    if(el.id==='importProgress'){importProgress(el.files?.[0]);el.value='';}
  });
  document.getElementById('wordDialog').addEventListener('click',(event)=>{
    if(event.target===event.currentTarget)event.currentTarget.close();
  });
  document.querySelectorAll('[data-ico]').forEach((element)=>element.innerHTML=ico(element.dataset.ico));
  document.getElementById('todayDate').textContent=new Intl.DateTimeFormat('zh-TW',{month:'long',day:'numeric',weekday:'short'}).format(new Date());
  if('speechSynthesis' in window){refreshVoices();window.speechSynthesis.addEventListener?.('voiceschanged',refreshVoices);}
  if(TOTAL!==650)console.warn('Unexpected vocabulary count:',TOTAL);
  render();
})();

</script>
</body>
</html>
